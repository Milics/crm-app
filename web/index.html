<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="专升本招生CRM - 招生顾问专用">

  <!-- iOS PWA 体验优化 -->
  <meta name="theme-color" content="#1976D2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="招生CRM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>专升本招生CRM</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1976D2;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1565C0 0%, #1976D2 50%, #1E88E5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.5s ease-out;
      pointer-events: auto;
    }

    .splash-card {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
      max-width: 290px;
      width: 82%;
    }

    .splash-logo {
      width: 68px;
      height: 68px;
      background: #FFFFFF;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
      margin-bottom: 18px;
    }

    .splash-logo svg {
      width: 38px;
      height: 38px;
      fill: #1976D2;
    }

    .splash-title {
      color: #FFFFFF;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .splash-subtitle {
      color: rgba(255, 255, 255, 0.88);
      font-size: 12.5px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.4;
      min-height: 36px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3.5px solid rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #error-display {
      display: none;
      margin-top: 14px;
      padding: 10px;
      background: rgba(255, 50, 50, 0.2);
      border: 1px solid rgba(255, 100, 100, 0.4);
      border-radius: 8px;
      color: #FFF;
      font-size: 11px;
      max-height: 80px;
      overflow-y: auto;
      text-align: left;
      word-break: break-all;
    }

    #retry-box {
      display: none;
      margin-top: 18px;
      text-align: center;
    }

    .retry-btn {
      background: #FFFFFF;
      color: #1565C0;
      border: none;
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }
  </style>
</head>
<body>
  <!-- 启动屏 -->
  <div id="loading-splash">
    <div class="splash-card">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <div class="splash-title">专升本招生 CRM</div>
      <div class="splash-subtitle" id="status-text">首次启动中，正在载入核心组件...</div>
      <div class="spinner" id="splash-spinner"></div>
      <div id="error-display"></div>
      <div id="retry-box">
        <button class="retry-btn" onclick="forceCleanAndReload()">⚡️ 清理缓存重试</button>
      </div>
    </div>
  </div>

  <script>
    // 捕获可能出现的 JS 异常并打印在屏幕上供排错
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var errBox = document.getElementById('error-display');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerText = '错误: ' + msg + ' (行:' + lineNo + ')';
      }
    };
    window.onunhandledrejection = function(event) {
      var errBox = document.getElementById('error-display');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerText = '异常: ' + (event.reason ? event.reason.message || event.reason : '未捕获拒绝');
      }
    };

    var statusText = document.getElementById('status-text');
    var progressStep = 0;
    var statusInterval = setInterval(function() {
      progressStep++;
      if (progressStep === 3 && statusText) {
        statusText.innerText = '正在初始化数据渲染引擎...';
      } else if (progressStep === 6 && statusText) {
        statusText.innerText = '即将进入招生管理系统...';
      } else if (progressStep >= 12) {
        clearInterval(statusInterval);
        var retryBox = document.getElementById('retry-box');
        if (retryBox) retryBox.style.display = 'block';
      }
    }, 1000);

    function hideSplash() {
      clearInterval(statusInterval);
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 500);
      }
    }

    function forceCleanAndReload() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) r.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
      window.location.reload(true);
    }

    // 多重感知隐藏机制（确保任何一种情况被触发都能瞬间进入系统）
    window.addEventListener('flutter-first-frame', hideSplash);

    var domCheck = setInterval(function() {
      if (
        document.querySelector('flutter-view') ||
        document.querySelector('flt-glass-pane') ||
        document.querySelector('flt-scene-host') ||
        document.querySelector('canvas') ||
        document.body.getAttribute('flt-renderer')
      ) {
        clearInterval(domCheck);
        hideSplash();
      }
    }, 250);

    // 15 秒终极安全兜底淡出
    setTimeout(function() {
      clearInterval(domCheck);
      hideSplash();
    }, 15000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
